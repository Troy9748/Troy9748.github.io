---
layout: framework
title: 内容
heading: "内容索引"
subheading: "搜索、筛选与排序全部公开内容"
permalink: /explore/
---

<section class="content-explorer" data-content-explorer>
  <header class="page-lead">
    <p class="eyebrow">EXPLORE</p>
    <h1>内容索引</h1>
    <p>按关键词、内容类型或发布时间浏览全部公开内容。</p>
  </header>

  <div class="explorer-controls">
    <label class="search-field">
      <span>关键词</span>
      <input type="search" data-search placeholder="搜索标题、摘要、标签或正文" autocomplete="off">
    </label>

    <label>
      <span>内容类型</span>
      <select data-type>
        <option value="">全部内容</option>
        <option value="research">科研成果</option>
        <option value="notes">科研笔记</option>
        <option value="essay">随笔</option>
        <option value="photography">摄影</option>
        <option value="music">音乐</option>
      </select>
    </label>

    <label>
      <span>排序</span>
      <select data-sort>
        <option value="newest">最新发布</option>
        <option value="oldest">最早发布</option>
        <option value="title">标题 A–Z</option>
      </select>
    </label>
  </div>

  <p class="result-count" data-count aria-live="polite"></p>
  <div class="explorer-results" data-results></div>
  <p class="empty-state" data-empty hidden>没有匹配的内容，试试减少关键词或切换分类。</p>

  <script type="application/json" data-posts>
    [
      {%- for post in site.posts -%}
      {
        "title": {{ post.title | jsonify }},
        "subtitle": {{ post.subtitle | default: post.excerpt | strip_html | strip_newlines | jsonify }},
        "url": {{ post.url | relative_url | jsonify }},
        "date": {{ post.date | date_to_xmlschema | jsonify }},
        "categories": {{ post.categories | jsonify }},
        "tags": {{ post.tags | jsonify }},
        "content": {{ post.content | strip_html | strip_newlines | jsonify }}
      }{% unless forloop.last %},{% endunless %}
      {%- endfor -%}
    ]
  </script>
</section>

<script src="{{ '/assets/js/explore.js' | relative_url }}" defer></script>
